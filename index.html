    async function obtenerSiguienteEjemplar(origen, curso, materia) {
        try {
            const { data, error } = await supabase
                .from('libros')
                .select('signatura')
                .eq('origen', origen)
                .eq('curso_para', curso || '')
                .eq('materia', materia || '')
                .not('signatura', 'is', null)
                .order('signatura', { ascending: false })
                .limit(1);

                console.error('Error al obtener siguiente ejemplar:', error);
                return null;
            }
            
            if (data && data.length > 0) {
                const match = data[0].signatura.match(/(\d+)$/);
                if (match) {
                    const numero = parseInt(match[1], 10) + 1;
                    return numero.toString().padStart(3, '0');

    async function verificarLogin() {
        if (sessionStorage.getItem('loggedIn') === 'true') {

    async function hacerLogin() {
        const username = document.getElementById('loginUser').value.trim();
        const password = document.getElementById('loginPass').value;

                .from('usuarios_app')

                .eq('username', username)

    async function marcarAnoActivo() {
        const anoId = currentAnoId;
        if (!anoId) {
            alert("No hay año seleccionado");
            return;
        }
        
        // Obtener el nombre del año
        const { data: ano } = await supabase.from('ano_academico').select('nombre').eq('id', anoId).single();
        
        if (!confirm(`¿Marcar el año ${ano.nombre} como activo?\n\nEsto significa que al cargar la página, se seleccionará automáticamente este año.`)) return;
        
        // Desmarcar todos los años
        await supabase.from('ano_academico').update({ activo: false }).neq('id', 0);
        
        // Marcar el seleccionado como activo
        await supabase.from('ano_academico').update({ activo: true }).eq('id', anoId);
        
        // Actualizar el selector visualmente
        const select = document.getElementById('selectAnoAcademico');
        for (let i = 0; i < select.options.length; i++) {
            const option = select.options[i];
            const optionValue = parseInt(option.value);
            if (optionValue === anoId) {
                option.textContent = `${ano.nombre} (Activo)`;
                option.selected = true;
            } else {
                // Quitar "(Activo)" de otros años
                option.textContent = option.textContent.replace(' (Activo)', '');
            }
        }
        
        // Actualizar variable global
        currentAnoId = anoId;
        
        alert(`✅ Ahora el año ${ano.nombre} es el activo.`);
        
        // Recargar la pestaña actual
        cargarTab(currentTab);
    }    
    async function cargarAnosAcademicos() {
        const { data: anos } = await supabase.from('ano_academico').select('*').order('id', { ascending: false });
        const select = document.getElementById('selectAnoAcademico');
        if(!anos || anos.length === 0) {
            select.innerHTML = '<option>Crear años académicos en SQL</option>';
            return;
        }
        select.innerHTML = '';
        anos.forEach(ano => {
            const option = document.createElement('option');
            option.value = ano.id;
            option.textContent = `${ano.nombre} ${ano.activo ? '(Activo)' : ''}`;
            if (ano.activo) {
                option.selected = true;
                currentAnoId = ano.id;
            }
            select.appendChild(option);
        });
        select.addEventListener('change', (e) => {
            currentAnoId = parseInt(e.target.value);
            if (currentTab) cargarTab(currentTab);
        });
    }
    // ==================== PROMOCIÓN DE CURSO ====================

    }
    
    async function cargarAlumnosParaPromocion(anoOrigenId, anoDestinoId) {
        const curso = document.getElementById('promocionCursoOrigen').value;
        const grupo = document.getElementById('promocionGrupoOrigen').value.trim();
        
        if (!curso) {
            alert("Selecciona un curso");
            return;
        }
        
        const listaDiv = document.getElementById('listaPromocion');
        listaDiv.innerHTML = '<p>Cargando alumnos...</p>';
        
        // Obtener alumnos del curso origen
        let query = supabase
            .from('historial_alumnos')
            .select('*, alumnos(*)')
            .eq('ano_academico_id', anoOrigenId)
            .eq('curso', curso);
        
        if (grupo) query = query.eq('grupo', grupo);
        
        const { data: alumnosOrigen } = await query;
        
        if (!alumnosOrigen || alumnosOrigen.length === 0) {
            listaDiv.innerHTML = '<p>No hay alumnos en este curso/grupo</p>';
            return;
        }
        
        // Mapa de curso destino
        const cursoDestinoMap = {
            '1ESO': '2ESO',
            '2ESO': '3ESO',
            '3ESO': '4ESO',
            '4ESO': '1BAC',
            '1BAC': '2BAC',
            '2BAC': '2BAC'  // Los de 2BAC ya no promocionan

    async function guardarPromocion(anoDestinoId) {
        const filas = document.querySelectorAll('#listaPromocion tbody tr');
        let creados = 0;
        let errores = 0;
        
        for (const fila of filas) {
            const alumnoId = parseInt(fila.dataset.alumnoId);
            const historialOrigenId = parseInt(fila.dataset.historialId);
            const cursoDestino = fila.querySelector('.curso-destino')?.value;
            const grupoDestino = fila.querySelector('.grupo-destino')?.value;
            const baja = fila.querySelector('.baja-checkbox')?.checked;
            const yaPromocionado = fila.querySelector('.curso-destino')?.disabled;
            
            if (yaPromocionado || baja) continue;
            if (!cursoDestino) continue;
            
            const { data: origen } = await supabase
                .from('historial_alumnos')
                .select('*')
                .eq('id', historialOrigenId)
                .single();
            
            if (!origen) continue;
            
            const nuevoHistorial = {
                alumno_id: alumnoId,
                ano_academico_id: anoDestinoId,
                curso: cursoDestino,
                grupo: grupoDestino || '',
                telefono: origen.telefono || '',
                bilingue: false,
                beca: false,
                socio_ampa: false,
                diversificacion: origen.diversificacion || false,
                donante: origen.donante || false,
                observaciones: origen.observaciones || '',
                activo: true,
                lote_entregado: false
            };
            
            const { error } = await supabase.from('historial_alumnos').insert(nuevoHistorial);
            
            if (error) {
                console.error('Error al promocionar:', error);
                errores++;
            } else {
                creados++;
                fila.style.backgroundColor = '#dcfce7';
                const tdEstado = fila.querySelector('td:last-child');
                if (tdEstado) tdEstado.innerHTML = '✅ Promocionado';
            }
        }
        
        alert(`✅ Promoción completada: ${creados} alumnos promocionados.\n❌ Errores: ${errores}`);
        
        if (creados > 0) {
            // Cambiar selector al nuevo año automáticamente
            const select = document.getElementById('selectAnoAcademico');
            for (let i = 0; i < select.options.length; i++) {
                if (parseInt(select.options[i].value) === anoDestinoId) {
                    select.selectedIndex = i;
                    break;
                }
            }
            // Disparar evento change para que se actualice currentAnoId
            const event = new Event('change');
            select.dispatchEvent(event);
            
            // Cerrar modal
            document.getElementById('modalPromocion')?.remove();
            
            alert(`🔄 Año cambiado automáticamente al nuevo curso. Ahora puedes buscar alumnos promocionados.`);
            
            // Recargar la pestaña actual para mostrar datos del nuevo año
            cargarTab(currentTab);
        }
    }

    async function buscarAlumnosParaEntrega() {
        const nombreRaw = document.getElementById('entregarNombre').value.trim();
        const apellidosRaw = document.getElementById('entregarApellidos').value.trim();
        const cursoFiltro = document.getElementById('entregarCurso').value;
        const grupoFiltro = document.getElementById('entregarGrupo').value.trim();
        const codigoRaw = document.getElementById('entregarCodigo').value.trim();
        
        const resultadosDiv = document.getElementById('entregarResultados');
        
        const nombreBusq = normalizarTexto(nombreRaw);
        const apellidosBusq = normalizarTexto(apellidosRaw);
        
        resultadosDiv.innerHTML = '<p>Buscando...</p>';
        
        const { data: anoActivo } = await supabaseDebug.from('ano_academico').select('id').eq('activo', true).single();
        const anoId = anoActivo.id;
        
        // 1. Obtener historial de alumnos
        let query = supabaseDebug
            .from('historial_alumnos')
            .select('*, alumnos(*)')
            .eq('activo', true)
            .eq('ano_academico_id', anoId);
        
        if (cursoFiltro) query = query.eq('curso', cursoFiltro);
        if (grupoFiltro) query = query.eq('grupo', grupoFiltro);
        
        const { data: historiales, error } = await query;
        
        if (error) {
            resultadosDiv.innerHTML = `<p>Error: ${error.message}</p>`;
            return;
        }
        
        // 2. Obtener TODOS los préstamos activos de una vez
        const { data: todosPrestamos } = await supabaseDebug
            .from('prestamos')
            .select('alumno_id, id')
            .eq('entregado', false)
            .eq('ano_academico_id', anoId);
        
        const prestamosCount = {};
        for (const p of todosPrestamos || []) {
            prestamosCount[p.alumno_id] = (prestamosCount[p.alumno_id] || 0) + 1;
        }
        
        let resultados = [];
        for (const h of historiales) {
            const librosPrestados = prestamosCount[h.alumnos.id] || 0;
            const yaEntregado = h.lote_entregado || false;
            
            let estado = '';
            let colorEstado = '';
            
            if (yaEntregado) {
                estado = '✅ Lote entregado';
                colorEstado = '#10b981';
            } else if (librosPrestados > 0) {
                estado = '📦 Lote preparado (pendiente)';
                colorEstado = '#f59e0b';
            } else {
                estado = '❌ Sin libros asignados';
                colorEstado = '#64748b';
            }
            
            resultados.push({
                id: h.alumnos.id,
                nombre: h.alumnos.nombre,
                apellidos: h.alumnos.apellidos,
                codigo_usuario: h.alumnos.codigo_usuario,
                curso: h.curso,
                grupo: h.grupo,
                beca: h.beca,
                socio_ampa: h.socio_ampa,
                librosPrestados: librosPrestados,
                yaEntregado: yaEntregado,
                estado: estado,
                colorEstado: colorEstado
            });
        }
        
        // Filtrar adicionalmente
        if (codigoRaw) {
            resultados = resultados.filter(a => String(a.codigo_usuario).includes(codigoRaw));
        }
        if (nombreBusq) {
            resultados = resultados.filter(a => normalizarTexto(a.nombre).includes(nombreBusq));
        }
        if (apellidosBusq) {
            resultados = resultados.filter(a => normalizarTexto(a.apellidos).includes(apellidosBusq));
        }
        
        if (resultados.length === 0) {
            resultadosDiv.innerHTML = '<p>No se encontraron alumnos</p>';
            return;
        }
        
        mostrarTablaResultadosEntrega(resultados, resultadosDiv);
    }

    async function buscarClaseParaEntregaLista() {
        const curso = document.getElementById('filtroCursoEntregaClase').value;
        const grupo = document.getElementById('filtroGrupoEntregaClase').value.trim();
        const resultadosDiv = document.getElementById('resultadoClaseEntregaLista');
        
        if (!curso) {
            resultadosDiv.innerHTML = '<p>Selecciona un curso</p>';
            return;
        }
        
        resultadosDiv.innerHTML = '<p>Buscando...</p>';
        
        const { data: anoActivo } = await supabaseDebug.from('ano_academico').select('id').eq('activo', true).single();
        const anoId = anoActivo.id;
        
        let query = supabaseDebug
            .from('historial_alumnos')
            .select('*, alumnos(*)')
            .eq('ano_academico_id', anoId)
            .eq('curso', curso);
        
        if (grupo) query = query.eq('grupo', grupo);
        
        const { data: historiales, error } = await query;
        
        if (error) {
            resultadosDiv.innerHTML = `<p>Error: ${error.message}</p>`;
            return;
        }
        
        if (!historiales || historiales.length === 0) {
            resultadosDiv.innerHTML = '<p>No hay alumnos en esta clase</p>';
            return;
        }
        
        // Obtener préstamos de una vez
        const { data: todosPrestamos } = await supabaseDebug
            .from('prestamos')
            .select('alumno_id, id')
            .eq('entregado', false)
            .eq('ano_academico_id', anoId);
        
        const prestamosCount = {};
        for (const p of todosPrestamos || []) {
            prestamosCount[p.alumno_id] = (prestamosCount[p.alumno_id] || 0) + 1;
        }
        
        let resultados = [];
        for (const h of historiales) {
            const librosPrestados = prestamosCount[h.alumnos.id] || 0;
            const yaEntregado = h.lote_entregado || false;
            
            let estado = '';
            let colorEstado = '';
            
            if (yaEntregado) {
                estado = '✅ Lote entregado';
                colorEstado = '#10b981';
            } else if (librosPrestados > 0) {
                estado = '📦 Lote preparado (pendiente)';
                colorEstado = '#f59e0b';
            } else {
                estado = '❌ Sin libros asignados';
                colorEstado = '#64748b';
            }
            
            resultados.push({
                id: h.alumnos.id,
                nombre: h.alumnos.nombre,
                apellidos: h.alumnos.apellidos,
                codigo_usuario: h.alumnos.codigo_usuario,
                curso: h.curso,
                grupo: h.grupo,
                beca: h.beca,
                socio_ampa: h.socio_ampa,
                librosPrestados: librosPrestados,
                yaEntregado: yaEntregado,
                estado: estado,
                colorEstado: colorEstado
            });
        }
        
        if (resultados.length === 0) {
            resultadosDiv.innerHTML = '<p>No se encontraron alumnos</p>';
            return;
        }
        
        // REUTILIZAR LA MISMA FUNCIÓN DE VISUALIZACIÓN
        mostrarTablaResultadosEntrega(resultados, resultadosDiv);
    }

    async function buscarAlumnosMejorado() {
        // USAR EL AÑO SELECCIONADO EN EL SELECTOR, NO EL AÑO ACTIVO
        const anoId = currentAnoId;
        
        if (!anoId) {
            console.error("No hay año seleccionado");
            return;
        }
        
        const nombreRaw = document.getElementById('searchNombre').value.trim();
        const apellidosRaw = document.getElementById('searchApellidos').value.trim();
        const cursoFiltro = document.getElementById('searchCurso').value;
        const codigoRaw = document.getElementById('searchCodigo').value.trim();
        
        const resultadosDiv = document.getElementById('resultadosBusqueda');
        
        const nombreBusq = normalizarTexto(nombreRaw);
        const apellidosBusq = normalizarTexto(apellidosRaw);
        
        resultadosDiv.innerHTML = '<p>Buscando...</p>';
        
        // 1. Obtener historial de alumnos del AÑO SELECCIONADO
        let query = supabaseDebug
            .from('historial_alumnos')
            .select('*, alumnos(*)')
            .eq('activo', true)
            .eq('ano_academico_id', anoId);   // ← USAR anoId, NO año activo
        
        const { data: historiales, error } = await query;

        
        if (error) {
            resultadosDiv.innerHTML = `<p>Error: ${error.message}</p>`;
            return;
        }
        
        if (!historiales || historiales.length === 0) {
            resultadosDiv.innerHTML = '<p>No hay alumnos en el año académico actual</p>';
            return;
        }
        
        // 2. Obtener TODOS los préstamos activos del año (una sola consulta)
        const { data: todosPrestamos } = await supabaseDebug
            .from('prestamos')
            .select('*, libros(*)')
            .eq('entregado', false)
            .eq('ano_academico_id', anoId);
        
        // 3. Obtener TODOS los estados de entrega (una sola consulta)
        const { data: todosEntregas } = await supabaseDebug
            .from('historial_alumnos')
            .select('alumno_id, lote_entregado')
            .eq('ano_academico_id', anoId);
        
        // Crear mapas para acceso rápido
        const prestamosPorAlumno = {};
        for (const p of todosPrestamos || []) {
            if (!prestamosPorAlumno[p.alumno_id]) prestamosPorAlumno[p.alumno_id] = [];
            prestamosPorAlumno[p.alumno_id].push(p);
        }
        
        const entregaPorAlumno = {};
        for (const e of todosEntregas || []) {
            entregaPorAlumno[e.alumno_id] = e.lote_entregado || false;
        }
        
        // 4. Construir resultados
        let resultados = [];
        for (const h of historiales) {
            const alumnoId = h.alumnos.id;
            const prestamos = prestamosPorAlumno[alumnoId] || [];
            const loteEntregado = entregaPorAlumno[alumnoId] || false;
            const tieneLibros = prestamos.length > 0;
            
            let estadoLibros = '';

                estadoLibros = '📦 LOTE PREPARADO';

                estadoLibros = '📚 PRESTADOS';

                estadoLibros = '❌ Sin libros';

            let librosLista = '';

                librosLista = prestamos.map(p => p.libros?.titulo || 'Sin título').join(', ');

            }
            
            resultados.push({
                id: alumnoId,
                codigo: h.alumnos.codigo_usuario || '-',
                nombre: h.alumnos.nombre || '',
                apellidos: h.alumnos.apellidos || '',
                curso: h.curso || '-',
                grupo: h.grupo || '-',
                telefono: h.telefono || '-',
                beca: h.beca ? '✅' : '❌',
                socio_ampa: h.socio_ampa ? '✅' : '❌',
                bilingue: h.bilingue ? '✅' : '❌',
                diversificacion: h.diversificacion ? '✅' : '❌',
                donante: h.donante ? '✅' : '❌',
                observaciones: (h.observaciones || '').substring(0, 50),
                estadoLibros: estadoLibros,
                librosLista: librosLista
            });
        }

            resultados = resultados.filter(a => String(a.codigo).includes(codigoRaw));

        if (nombreBusq) {
            resultados = resultados.filter(a => normalizarTexto(a.nombre).includes(nombreBusq));
        }
        if (apellidosBusq) {
            resultados = resultados.filter(a => normalizarTexto(a.apellidos).includes(apellidosBusq));
        }
        if (cursoFiltro) {
            resultados = resultados.filter(a => a.curso === cursoFiltro);

    async function buscarSociosMejorado() {
        const anoId = currentAnoId;
        
        if (!anoId) {
            console.error("No hay año seleccionado");
            return;
        }
        
        const nombreRaw = document.getElementById('socioNombre').value.trim();
        const apellidosRaw = document.getElementById('socioApellidos').value.trim();
        const cursoFiltro = document.getElementById('socioCurso').value;
        const codigoRaw = document.getElementById('socioCodigo').value.trim();
        const estadoFiltro = document.getElementById('socioEstado').value;
        
        const resultadosDiv = document.getElementById('resultadosSocios');
        
        const nombreBusq = normalizarTexto(nombreRaw);
        const apellidosBusq = normalizarTexto(apellidosRaw);
        
        resultadosDiv.innerHTML = '<p>Buscando...</p>';
        
        const { data: historiales, error } = await supabaseDebug
            .from('historial_alumnos')
            .select('*, alumnos(*)')
            .eq('activo', true)
            .eq('ano_academico_id', anoId);
        
        if (error) {
            resultadosDiv.innerHTML = `<p>Error: ${error.message}</p>`;
            return;
        }
        
        let resultados = historiales.map(h => ({
            id: h.alumnos.id,
            nombre: h.alumnos.nombre,
            apellidos: h.alumnos.apellidos,
            codigo_usuario: h.alumnos.codigo_usuario,
            curso: h.curso,
            grupo: h.grupo,
            beca: h.beca,
            socio_ampa: h.socio_ampa,
            telefono: h.telefono,
            bilingue: h.bilingue,
            diversificacion: h.diversificacion
        }));
        
        // Filtros básicos
        if (codigoRaw) {
            resultados = resultados.filter(a => String(a.codigo_usuario || '').includes(codigoRaw));
        }
        if (nombreBusq) {
            resultados = resultados.filter(a => normalizarTexto(a.nombre || '').includes(nombreBusq));
        }
        if (apellidosBusq) {
            resultados = resultados.filter(a => normalizarTexto(a.apellidos || '').includes(apellidosBusq));
        }
        if (cursoFiltro) {
            resultados = resultados.filter(a => a.curso === cursoFiltro);
        }
        const grupoFiltro = document.getElementById('socioGrupo')?.value.trim();
        if (grupoFiltro) {
            resultados = resultados.filter(a => a.grupo === grupoFiltro);
        }        
        
        // OPTIMIZACIÓN: Una sola consulta para todos los socios
        const idsAlumnos = resultados.map(a => a.id);
        const { data: socios } = await supabaseDebug
            .from('socios')
            .select('alumno_id, n_socio')
            .in('alumno_id', idsAlumnos)
            .eq('ano_academico_id', anoId)
            .eq('activo', true);
        
        const socioMap = {};
        for (const s of socios || []) {
            socioMap[s.alumno_id] = s.n_socio;
        }
        
        for (const alumno of resultados) {
            alumno.n_socio = socioMap[alumno.id] || null;
        }
        
        // Filtrar por estado socio
        if (estadoFiltro === 'socio') {
            resultados = resultados.filter(a => a.socio_ampa === true);
        }
        
        if (resultados.length === 0) {
            resultadosDiv.innerHTML = '<p>No se encontraron alumnos</p>';
            return;
        }
        
        let html = `<h3>Resultados (${resultados.length})</h3>`;
        
        for (const alumno of resultados) {
            const esSocio = alumno.socio_ampa === true;
            html += `
                <div class="alumno-row">
                    <div class="alumno-info">
                        <strong>${alumno.nombre} ${alumno.apellidos || ''}</strong><br>
                        📋 Código: ${alumno.codigo_usuario || 'Sin código'} | Curso: ${alumno.curso} ${alumno.grupo || ''}<br>
                        ${esSocio ? '✅ Socio AMPA' : '❌ No es socio'}
                        ${alumno.n_socio ? `<br>📅 Nº Socio: ${alumno.n_socio}` : ''}
                    </div>
                    <div class="alumno-actions">
                        ${!esSocio ? `<button onclick="window.registrarPagoSocioDirecto(${alumno.id})">➕ Hacer socio</button>` : ''}
                        ${esSocio ? `<button class="danger" onclick="window.darBajaSocio(${alumno.id})">🗑️ Dar baja socio</button>` : ''}
                    </div>
                </div>
            `;
        }
        resultadosDiv.innerHTML = html;
    }

    async function buscarLibros() {
        const searchTerm = document.getElementById('searchLibroInput').value.trim();
        const materia = document.getElementById('filtroMateria').value;
        const curso = document.getElementById('filtroCurso').value;
        const editorial = document.getElementById('filtroEditorial').value;
        const estado = document.getElementById('filtroEstado').value;
        const origen = document.getElementById('filtroOrigen').value;
        
        const resultadosDiv = document.getElementById('resultadosLibros');
        resultadosDiv.innerHTML = '<p>Buscando...</p>';
        console.log("Filtros aplicados:", { searchTerm, materia, curso, editorial, estado, origen });
        
        let query = supabase.from('libros').select('*');
        // Filtrar por estado de préstamo
        const estadoPrestamoFiltro = document.getElementById('filtroEstadoPrestamo').value;
        
        if (estadoPrestamoFiltro === 'prestado') {
            // Solo libros que están prestados (lote entregado)
            const { data: prestamosActivos } = await supabase
                .from('prestamos')
                .select('libro_codigo')
                .eq('entregado', false);
            const codigosPrestados = prestamosActivos.map(p => p.libro_codigo);
            if (codigosPrestados.length > 0) {
                query = query.in('codigo_barras', codigosPrestados);
            } else {
                query = query.in('codigo_barras', ['ninguno']);
            }
        } 
        else if (estadoPrestamoFiltro === 'libre') {
            // Solo libros NO prestados (disponibles)
            const { data: prestamosActivos } = await supabase
                .from('prestamos')
                .select('libro_codigo')
                .eq('entregado', false);
            const codigosPrestados = prestamosActivos.map(p => p.libro_codigo);
            if (codigosPrestados.length > 0) {
                query = query.not('codigo_barras', 'in', `(${codigosPrestados.join(',')})`);
            }
        }
        else if (estadoPrestamoFiltro === 'preparado') {
            // Obtener alumnos con lote_entregado = false
            const { data: alumnosLotePendiente } = await supabase
                .from('historial_alumnos')
                .select('alumno_id')
                .eq('lote_entregado', false)
                .eq('ano_academico_id', currentAnoId);
            
            const alumnosIds = alumnosLotePendiente.map(a => a.alumno_id);
            
            if (alumnosIds.length > 0) {
                // Obtener libros prestados a esos alumnos (entregado = false)
                const { data: prestamosPreparados } = await supabase
                    .from('prestamos')
                    .select('libro_codigo')
                    .eq('entregado', false)
                    .in('alumno_id', alumnosIds);
                
                const codigosPreparados = prestamosPreparados.map(p => p.libro_codigo);
                if (codigosPreparados.length > 0) {
                    query = query.in('codigo_barras', codigosPreparados);
                } else {
                    query = query.in('codigo_barras', ['ninguno']);
                }
            } else {
                query = query.in('codigo_barras', ['ninguno']);
            }
        }

        
        const verSoloBaja = document.getElementById('verLibrosInactivos')?.checked;
        
        if (verSoloBaja) {
            query = query.eq('activo', false);
        } else {
            query = query.eq('activo', true);
        }
        
        if (searchTerm) {
            query = query.or(`titulo.ilike.%${searchTerm}%,signatura.ilike.%${searchTerm}%,codigo_barras.ilike.%${searchTerm}%`);
        }
        if (materia) query = query.ilike('materia', `%${materia}%`);
        if (curso) query = query.eq('curso_para', curso);
        if (editorial) query = query.ilike('editorial', `%${editorial}%`);
        if (estado) query = query.eq('estado', estado);
        if (origen) query = query.eq('origen', origen);
        
        const { data: libros, error } = await query.order('created_at', { ascending: false });
        
        if (error) {
            resultadosDiv.innerHTML = `<p>Error: ${error.message}</p>`;
            return;
        }
        
        if (!libros || libros.length === 0) {
            resultadosDiv.innerHTML = '<p>No se encontraron libros</p>';
            return;
        }
        
        let html = `<h3>Resultados (${libros.length})</h3>`;
        
        for (const libro of libros) {
            console.log("Libro:", libro);
            
            // Verificar si está prestado
            const { data: prestamo } = await supabase
                .from('prestamos')
                .select('*, alumnos(*)')
                .eq('libro_codigo', libro.codigo_barras)
                .eq('entregado', false)
                .maybeSingle();
            
            const estadoPrestamo = prestamo ? `🔴 Prestado a: ${prestamo.alumnos?.nombre}` : '🟢 Disponible';
            
            // Obtener datos de baja si el libro está inactivo
            let infoBaja = '';
            if (libro.activo === false) {
                const { data: baja } = await supabase
                    .from('bajas_libros')
                    .select('motivo, fecha_baja')
                    .eq('libro_codigo', libro.codigo_barras)
                    .maybeSingle();
                
                if (baja) {
                    infoBaja = `<br>📅 Baja: ${baja.fecha_baja || '-'} | Motivo: ${baja.motivo || '-'}`;
                }
            }
            
            html += `
                <div class="alumno-row">
                    <div class="alumno-info">
                        <strong>${libro.titulo}</strong> ${libro.activo === false ? '<span style="color:red;"> 🗑️ DADO DE BAJA</span>' : ''}<br>
                        📖 Signatura: ${libro.signatura || 'Sin asignar'} | Código: ${libro.codigo_barras}<br>
                        📚 Materia: ${libro.materia || '-'} | Curso: ${libro.curso_para || '-'}<br>
                        🏢 Editorial: ${libro.editorial || '-'} | Estado: ${libro.estado || 'nuevo'}<br>
                        🏷️ Origen: ${libro.origen || 'IES'} | ${estadoPrestamo}
                        ${infoBaja}
                        ${libro.incidencia ? `<br>⚠️ <strong style="color:#dc2626;">Incidencia:</strong> ${libro.incidencia}` : ''}                        
                    </div>
                    <div class="alumno-actions">
                        ${libro.activo === true ? `<button onclick="window.editarLibro('${libro.codigo_barras}')">✏️ Editar</button>` : ''}
                        ${libro.activo === true ? `<button class="danger" onclick="window.darBajaLibro('${libro.codigo_barras}')">🗑️ Dar baja</button>` : ''}
                        ${prestamo ? `<button class="secondary" onclick="window.verPrestamoLibro('${libro.codigo_barras}')">👤 Ver quién lo tiene</button>` : ''}
                    </div>
                </div>
            `;
        }
        resultadosDiv.innerHTML = html;
    }

    async function cargarPrestamosRapido() {
        let html = `
            <div class="card">
                <h2>🔄 Gestión de Préstamos</h2>
                <div class="flex">
                    <button id="btnPrepararLote" class="success">📦 Preparar lote</button>
                    <button id="btnEntregarLote" class="success">✅ Entregar lote</button>
                    <button id="btnRecogerLote" class="warning">📥 Recoger lote</button>
                </div>
                <div id="subpanelPrestamos"></div>
            </div>
        `;
        document.getElementById('mainPanel').innerHTML = html;
        
        // Función para resaltar botón activo
        function resaltarBoton(activo) {
            const btns = {
                preparar: document.getElementById('btnPrepararLote'),
                entregar: document.getElementById('btnEntregarLote'),
                recoger: document.getElementById('btnRecogerLote')
            };
            btns.preparar.classList.remove('btn-prestamo-activo');
            btns.entregar.classList.remove('btn-prestamo-activo');
            btns.recoger.classList.remove('btn-prestamo-activo');
            
            if (activo === 'preparar') btns.preparar.classList.add('btn-prestamo-activo');
            else if (activo === 'entregar') btns.entregar.classList.add('btn-prestamo-activo');
            else if (activo === 'recoger') btns.recoger.classList.add('btn-prestamo-activo');

    async function buscarAlumnosParaPreparar() {
        const nombreRaw = document.getElementById('prepararNombre').value.trim();
        const apellidosRaw = document.getElementById('prepararApellidos').value.trim();
        const cursoFiltro = document.getElementById('prepararCurso').value;
        const grupoFiltro = document.getElementById('prepararGrupo').value.trim();
        const codigoRaw = document.getElementById('prepararCodigo').value.trim();
        
        const resultadosDiv = document.getElementById('prepararResultados');
        
        const nombreBusq = normalizarTexto(nombreRaw);
        const apellidosBusq = normalizarTexto(apellidosRaw);
        
        resultadosDiv.innerHTML = '<p>Buscando...</p>';
        
        const { data: anoActivo } = await supabaseDebug.from('ano_academico').select('id').eq('activo', true).single();
        const anoId = anoActivo.id;
        
        // 1. Obtener historial de alumnos
        let query = supabaseDebug
            .from('historial_alumnos')
            .select('*, alumnos(*)')
            .eq('activo', true)
            .eq('ano_academico_id', anoId);
        
        if (cursoFiltro) query = query.eq('curso', cursoFiltro);
        if (grupoFiltro) query = query.eq('grupo', grupoFiltro);
        
        const { data: historiales, error } = await query;
        
        if (error) {
            resultadosDiv.innerHTML = `<p>Error: ${error.message}</p>`;
            return;
        }
        
        // 2. Obtener TODOS los préstamos activos de una vez
        const { data: todosPrestamos } = await supabaseDebug
            .from('prestamos')
            .select('alumno_id, id')
            .eq('entregado', false)
            .eq('ano_academico_id', anoId);
        
        const prestamosCount = {};
        for (const p of todosPrestamos || []) {
            prestamosCount[p.alumno_id] = (prestamosCount[p.alumno_id] || 0) + 1;
        }
        
        let resultados = [];
        for (const h of historiales) {
            const librosPrestados = prestamosCount[h.alumnos.id] || 0;
            const yaEntregado = h.lote_entregado || false;
            
            let estado = '';
            let colorEstado = '';
            
            if (yaEntregado) {
                estado = '✅ Lote entregado';
                colorEstado = '#10b981';
            } else if (librosPrestados > 0) {
                estado = '📦 Lote preparado (pendiente)';
                colorEstado = '#f59e0b';
            } else {
                estado = '❌ Sin libros asignados';
                colorEstado = '#64748b';
            }
            
            resultados.push({
                id: h.alumnos.id,
                nombre: h.alumnos.nombre,
                apellidos: h.alumnos.apellidos,
                codigo_usuario: h.alumnos.codigo_usuario,
                curso: h.curso,
                grupo: h.grupo,
                beca: h.beca,
                socio_ampa: h.socio_ampa,
                librosPrestados: librosPrestados,
                yaEntregado: yaEntregado,
                estado: estado,
                colorEstado: colorEstado
            });
        }
        
        // Filtrar adicionalmente
        if (codigoRaw) {
            resultados = resultados.filter(a => String(a.codigo_usuario).includes(codigoRaw));
        }
        if (nombreBusq) {
            resultados = resultados.filter(a => normalizarTexto(a.nombre).includes(nombreBusq));
        }
        if (apellidosBusq) {
            resultados = resultados.filter(a => normalizarTexto(a.apellidos).includes(apellidosBusq));
        }
        
        if (resultados.length === 0) {
            resultadosDiv.innerHTML = '<p>No se encontraron alumnos</p>';
            return;
        }
        
        // Usar la misma función de visualización que en Entregar lote
        mostrarTablaResultadosPreparar(resultados, resultadosDiv);
    }

    async function procesarLibroParaLote(codigo) {
        const { data: libro } = await supabase.from('libros').select('*').eq('codigo_barras', codigo).maybeSingle();
        
        if (!libro) {
            const crear = confirm("Libro no encontrado. ¿Quieres crearlo ahora?");
            if (crear) {
                await procesarNuevoLibroConEscanner(codigo);
                const { data: nuevoLibro } = await supabase.from('libros').select('*').eq('codigo_barras', codigo).single();
                if (nuevoLibro) {
                    loteTemporalPrestamo.push(nuevoLibro);
                    alert(`✅ Libro "${nuevoLibro.titulo}" añadido al lote`);
                    actualizarListaLotePrestamo();
                }
            }
        } else {
            // Verificar si el libro ya está prestado
            const { data: prestado } = await supabase
                .from('prestamos')
                .select('id')
                .eq('libro_codigo', libro.codigo_barras)
                .eq('entregado', false)
                .maybeSingle();
            
            if (prestado) {
                alert(`⚠️ El libro "${libro.titulo}" ya está prestado a otro alumno`);
            } else {
                loteTemporalPrestamo.push(libro);
                alert(`📚 Añadido: ${libro.titulo} (Total: ${loteTemporalPrestamo.length})`);
                actualizarListaLotePrestamo();
            }
        }
    }

    async function buscarAlumnosParaRecoger() {
        const nombreRaw = document.getElementById('recogerNombre').value.trim();
        const apellidosRaw = document.getElementById('recogerApellidos').value.trim();
        const cursoFiltro = document.getElementById('recogerCurso').value;
        const codigoRaw = document.getElementById('recogerCodigo').value.trim();
        
        const resultadosDiv = document.getElementById('recogerResultados');
        
        const nombreBusq = normalizarTexto(nombreRaw);
        const apellidosBusq = normalizarTexto(apellidosRaw);
        
        resultadosDiv.innerHTML = '<p>Buscando...</p>';
        
        const { data: anoActivo } = await supabaseDebug.from('ano_academico').select('id').eq('activo', true).single();
        const anoId = anoActivo.id;
        
        // 1. Obtener historial de alumnos
        let query = supabaseDebug
            .from('historial_alumnos')
            .select('*, alumnos(*)')
            .eq('ano_academico_id', anoId);
        
        const { data: historiales, error } = await query;
        
        if (error) {
            resultadosDiv.innerHTML = `<p>Error: ${error.message}</p>`;
            return;
        }
        
        // 2. Obtener TODOS los préstamos activos de una vez
        const { data: todosPrestamos } = await supabaseDebug
            .from('prestamos')
            .select('alumno_id, id')
            .eq('entregado', false)
            .eq('ano_academico_id', anoId);
        
        // Crear mapa de conteo de préstamos por alumno
        const prestamosCount = {};
        for (const p of todosPrestamos || []) {
            prestamosCount[p.alumno_id] = (prestamosCount[p.alumno_id] || 0) + 1;
        }
        
        let resultados = [];
        for (const h of historiales) {
            const librosPrestados = prestamosCount[h.alumnos.id] || 0;
            
            // SOLO alumnos que tienen libros prestados Y el lote ya fue entregado (prestados realmente)
            if (librosPrestados === 0) continue;
            if (h.lote_entregado !== true) continue;  // ← CLAVE: solo los que ya recogieron el lote
            
            resultados.push({
                id: h.alumnos.id,
                nombre: h.alumnos.nombre,
                apellidos: h.alumnos.apellidos,
                codigo_usuario: h.alumnos.codigo_usuario,
                curso: h.curso,
                grupo: h.grupo,
                beca: h.beca,
                socio_ampa: h.socio_ampa,
                librosPrestados: librosPrestados
            });
        }
        
        // Filtrar
        if (codigoRaw) {
            resultados = resultados.filter(a => String(a.codigo_usuario).includes(codigoRaw));
        }
        if (nombreBusq) {
            resultados = resultados.filter(a => normalizarTexto(a.nombre).includes(nombreBusq));
        }
        if (apellidosBusq) {
            resultados = resultados.filter(a => normalizarTexto(a.apellidos).includes(apellidosBusq));
        }
        if (cursoFiltro) {
            resultados = resultados.filter(a => a.curso === cursoFiltro);
        }
        const grupoFiltro = document.getElementById('searchGrupo')?.value.trim();
        if (grupoFiltro) {
            resultados = resultados.filter(a => a.grupo === grupoFiltro);
        }        
        if (resultados.length === 0) {
            resultadosDiv.innerHTML = '<p>✅ No hay alumnos con libros prestados actualmente</p>';
            return;
        }
        
        // Mostrar resultados en tabla
        let html = `<h3>Alumnos con libros prestados (${resultados.length})</h3>
            <div style="overflow-x:auto;">
                <table style="width:100%; border-collapse:collapse; font-size:0.75rem;">
                    <thead><tr style="background:#2563eb; color:white;">
                        <th>Código</th><th>Nombre</th><th>Apellidos</th><th>Curso</th><th>Grupo</th>
                        <th>Beca</th><th>Socio</th><th>Libros pendientes</th><th></th>
                    </tr></thead>
                    <tbody>`;
        
        for (const a of resultados) {
            html += `
                <tr style="border-bottom:1px solid #ddd;">
                    <td style="padding:6px;">${a.codigo_usuario || '-'}</td>
                    <td style="padding:6px;">${a.nombre}</td>
                    <td style="padding:6px;">${a.apellidos || ''}</td>
                    <td style="padding:6px;">${a.curso}</td>
                    <td style="padding:6px;">${a.grupo || ''}</td>
                    <td style="padding:6px; text-align:center;">${a.beca ? '✅' : '❌'}</td>
                    <td style="padding:6px; text-align:center;">${a.socio_ampa ? '✅' : '❌'}</td>
                    <td style="padding:6px; text-align:center; font-weight:bold;">${a.librosPrestados}</td>
                    <td style="padding:6px;"><button onclick="seleccionarAlumnoRecogerDetalle(${a.id})">📖 Ver libros</button></td>
                </tr>
            `;
        }
        html += `</tbody></table></div>`;
        resultadosDiv.innerHTML = html;
    }

    // ==================== ESCÁNER ====================
    function abrirScanner() {
        if (scannerActivo) return;
        document.getElementById("scannerModal").style.display = "block";
        if (!html5QrCode) html5QrCode = new Html5Qrcode("qr-reader");
        scannerActivo = true;
        html5QrCode.start(
            { facingMode: "environment" },
            { fps: 10, qrbox: { width: 250, height: 250 } },
            (texto) => {
                if (html5QrCode && html5QrCode.isScanning) {
                    html5QrCode.stop().then(() => {
                        scannerActivo = false;
                        document.getElementById("scannerModal").style.display = "none";
                        procesarEscaneo(texto);
                    }).catch(() => {
                        scannerActivo = false;
                        document.getElementById("scannerModal").style.display = "none";
                        procesarEscaneo(texto);
                    });
                } else {
                    scannerActivo = false;
                    document.getElementById("scannerModal").style.display = "none";
                    procesarEscaneo(texto);
                }
            },
            (error) => {}
        ).catch(err => {
            alert("Error cámara: " + err);
            cerrarScanner();
        });
    }
    function normalizarTexto(texto) {
        if (!texto) return '';
        return texto.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
    }

    async function procesarEscaneo(codigo) {
        if (modoActual === "prestamo_rapido") {
            // Escaneo de alumno (por código de usuario)
            const { data: alumno } = await supabase.from('alumnos').select('*').eq('codigo_usuario', parseInt(codigo)).maybeSingle();
            if(alumno) {
                window.editarAlumno(alumno.id);
                alert(`Alumno: ${alumno.nombre}`);
            } else {
                alert('Código de alumno no reconocido');
            }
        }
        else if (modoActual === "prestar_libro_lote") {
            await procesarLibroParaLote(codigo);
        }
        else if (modoActual === "escanear_info_libro") {
            await procesarEscanearInfoLibro(codigo);
        }            
        else if (modoActual === "devolucion_libro") {
            await procesarDevolucionLibro(codigo);
        }
        else if (modoActual === "prestar_libro_lote_preparar") {
            await procesarLibroParaLotePreparar(codigo);
        } 
        else if (modoActual === "devolucion_libro_recoger_detalle") {
            await window.procesarDevolucionRecogerDetalle(codigo);
        }            
        else if (modoActual === "escanear_libro") {
            // Escaneo para añadir nuevo libro
            await procesarNuevoLibroConEscanner(codigo);
        }
        else if (modoActual === "devolucion_libro_recoger") {
            await window.procesarDevolucionRecoger(codigo);
        }            
        else if (modoActual === "prestar_libro") {
            // Escaneo para prestar libro a un alumno
            const { data: libro } = await supabase.from('libros').select('*').eq('codigo_barras', codigo).maybeSingle();
            if(!libro) {
                const crear = confirm("Libro no encontrado. ¿Quieres crearlo ahora?");
                if(crear) {
                    await procesarNuevoLibroConEscanner(codigo);
                    const { data: nuevoLibro } = await supabase.from('libros').select('*').eq('codigo_barras', codigo).single();
                    if(nuevoLibro && currentEditingAlumnoId) {
                        await supabase.from('prestamos').insert({
                            libro_codigo: codigo,
                            alumno_id: currentEditingAlumnoId,
                            fecha_prestamo: new Date().toISOString().slice(0,10),
                            ano_academico_id: currentAnoId,
                            entregado: false
                        });
                        alert("✅ Libro creado y prestado correctamente");
                        window.editarAlumno(currentEditingAlumnoId);
                    }
                }
            } else {
                const { error } = await supabase.from('prestamos').insert({
                    libro_codigo: libro.codigo_barras,
                    alumno_id: currentEditingAlumnoId,
                    fecha_prestamo: new Date().toISOString().slice(0,10),
                    ano_academico_id: currentAnoId,
                    entregado: false
                });
                if(error) {
                    alert('Error al prestar: ' + error.message);
                } else {
                    alert(`✅ Libro "${libro.titulo}" prestado correctamente`);
                    window.editarAlumno(currentEditingAlumnoId);
                }
            }
        }
        modoActual = "";
    }
    async function procesarLibroParaLotePreparar(codigo) {
        const { data: libro } = await supabase.from('libros').select('*').eq('codigo_barras', codigo).maybeSingle();
        
        if (!libro) {
            const crear = confirm("Libro no encontrado. ¿Quieres crearlo ahora?");
            if (crear) {
                await procesarNuevoLibroConEscanner(codigo);
                const { data: nuevoLibro } = await supabase.from('libros').select('*').eq('codigo_barras', codigo).single();
                if (nuevoLibro) {
                    loteTemporalPrestamo.push(nuevoLibro);
                    alert(`✅ Libro "${nuevoLibro.titulo}" añadido al lote`);
                    actualizarListaPrepararLote();
                }
            }
        } else {
            // Verificar si el libro ya está prestado
            const { data: prestado } = await supabase
                .from('prestamos')
                .select('id')
                .eq('libro_codigo', libro.codigo_barras)
                .eq('entregado', false)
                .maybeSingle();
            
            if (prestado) {
                alert(`⚠️ El libro "${libro.titulo}" ya está prestado a otro alumno`);
            } else {
                loteTemporalPrestamo.push(libro);
                alert(`📚 Añadido: ${libro.titulo} (Total: ${loteTemporalPrestamo.length})`);
                actualizarListaPrepararLote();
            }
        }
    }

    async function generarListado() {

        if (tipo === 'bilingues') query = query.eq('bilingue', true);
        if (tipo === 'socios') query = query.eq('socio_ampa', true);
        if (tipo === 'no_socios') query = query.eq('socio_ampa', false);
        if (tipo === 'donantes') query = query.eq('donante', true);

    function exportarAExcel() {
        const resultadosDiv = document.getElementById('resultadoListado');
        if (!resultadosDiv) {
            alert('Primero genera un listado');
            return;
        }
        
        // Clonar todo el contenido del div
        const contenido = resultadosDiv.cloneNode(true);
        
        // Eliminar botones y elementos interactivos
        const botones = contenido.querySelectorAll('button, .btn, .edit-icon');
        botones.forEach(btn => btn.remove());
        
        // Aplicar estilos básicos para que se vea bien en Excel
        contenido.style.padding = '10px';
        contenido.style.fontFamily = 'Arial, sans-serif';
        
        // Dar estilo a todas las tablas
        const tablas = contenido.querySelectorAll('table');
        tablas.forEach(tabla => {
            tabla.style.borderCollapse = 'collapse';
            tabla.style.width = '100%';
            tabla.style.fontSize = '11pt';
            tabla.style.marginBottom = '20px';
            
            // Estilo para celdas
            const celdas = tabla.querySelectorAll('th, td');
            celdas.forEach(celda => {
                celda.style.border = '1px solid #ddd';
                celda.style.padding = '6px';
            });
            
            // Estilo para encabezados
            const headers = tabla.querySelectorAll('th');
            headers.forEach(th => {
                th.style.backgroundColor = '#2563eb';
                th.style.color = 'white';
                th.style.fontWeight = 'bold';
            });
        });
        
        // Obtener el HTML completo con meta charset UTF-8
        const html = `
            <!DOCTYPE html>
            <html>
            <head>
                <meta charset="UTF-8">
                <title>Listado_${new Date().toISOString().slice(0,19)}</title>
                <style>
                    body { font-family: Arial, sans-serif; margin: 20px; }
                </style>
            </head>
            <body>
                ${contenido.innerHTML}
            </body>
            </html>
        `;
        
        // Añadir BOM para UTF-8 (tildes y ñ)
        const blob = new Blob(["\uFEFF" + html], { type: 'application/vnd.ms-excel' });
        const link = document.createElement('a');
        const url = URL.createObjectURL(blob);
        link.href = url;
        link.download = `listado_${new Date().toISOString().slice(0,19)}.xls`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
    }

    // ==================== COPIA DE SEGURIDAD COMPLETA ====================
    async function descargarBackupExcel() {
        const loadingMsg = document.createElement('div');
        loadingMsg.innerHTML = '<div style="position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); background:white; padding:20px; border-radius:12px; z-index:10000;">📥 Generando copia de seguridad...<br>Por favor, espera.</div>';
        document.body.appendChild(loadingMsg);
        
        try {
            // Obtener todos los datos
            const [alumnos, libros, prestamos, socios, historial] = await Promise.all([
                supabase.from('alumnos').select('*').order('id'),
                supabase.from('libros').select('*').order('titulo'),
                supabase.from('prestamos').select('*, alumnos(nombre, apellidos), libros(titulo, materia)').order('id'),
                supabase.from('socios').select('*, alumnos(nombre, apellidos)').order('id'),
                supabase.from('historial_alumnos').select('*, alumnos(nombre, apellidos)').order('id')
            ]);
            
            // Crear un libro de Excel con múltiples hojas usando SheetJS
            // Para ello, primero necesitamos cargar la librería SheetJS
            if (typeof XLSX === 'undefined') {
                await cargarSheetJS();
            }
            
            const wb = XLSX.utils.book_new();
            
            // Hoja 1: Alumnos
            if (alumnos.data && alumnos.data.length > 0) {
                const wsAlumnos = XLSX.utils.json_to_sheet(alumnos.data);
                XLSX.utils.book_append_sheet(wb, wsAlumnos, 'Alumnos');
            }
            
            // Hoja 2: Libros
            if (libros.data && libros.data.length > 0) {
                const wsLibros = XLSX.utils.json_to_sheet(libros.data);
                XLSX.utils.book_append_sheet(wb, wsLibros, 'Libros');
            }
            
            // Hoja 3: Préstamos
            if (prestamos.data && prestamos.data.length > 0) {
                const prestamosFormateados = prestamos.data.map(p => ({
                    id: p.id,
                    libro_codigo: p.libro_codigo,
                    libro_titulo: p.libros?.titulo,
                    alumno_id: p.alumno_id,
                    alumno_nombre: p.alumnos?.nombre,
                    alumno_apellidos: p.alumnos?.apellidos,
                    fecha_prestamo: p.fecha_prestamo,
                    fecha_devolucion: p.fecha_devolucion,
                    entregado: p.entregado,
                    ano_academico_id: p.ano_academico_id,
                    notas: p.notas
                }));
                const wsPrestamos = XLSX.utils.json_to_sheet(prestamosFormateados);
                XLSX.utils.book_append_sheet(wb, wsPrestamos, 'Préstamos');
            }
            
            // Hoja 4: Socios
            if (socios.data && socios.data.length > 0) {
                const sociosFormateados = socios.data.map(s => ({
                    id: s.id,
                    n_socio: s.n_socio,
                    alumno_id: s.alumno_id,
                    alumno_nombre: s.alumnos?.nombre,
                    alumno_apellidos: s.alumnos?.apellidos,
                    ano_academico_id: s.ano_academico_id,
                    fecha_pago: s.fecha_pago,
                    pagado: s.pagado,
                    activo: s.activo
                }));
                const wsSocios = XLSX.utils.json_to_sheet(sociosFormateados);
                XLSX.utils.book_append_sheet(wb, wsSocios, 'Socios');
            }
            
            // Hoja 5: Historial Alumnos
            if (historial.data && historial.data.length > 0) {
                const historialFormateado = historial.data.map(h => ({
                    id: h.id,
                    alumno_id: h.alumno_id,
                    alumno_nombre: h.alumnos?.nombre,
                    alumno_apellidos: h.alumnos?.apellidos,
                    ano_academico_id: h.ano_academico_id,
                    curso: h.curso,
                    grupo: h.grupo,
                    telefono: h.telefono,
                    bilingue: h.bilingue,
                    beca: h.beca,
                    socio_ampa: h.socio_ampa,
                    diversificacion: h.diversificacion,
                    donante: h.donante,
                    observaciones: h.observaciones,
                    lote_entregado: h.lote_entregado,
                    fecha_entrega: h.fecha_entrega,
                    activo: h.activo
                }));
                const wsHistorial = XLSX.utils.json_to_sheet(historialFormateado);
                XLSX.utils.book_append_sheet(wb, wsHistorial, 'Historial_Alumnos');
            }
            
            // Exportar archivo
            const fecha = new Date().toISOString().slice(0,19).replace(/:/g, '-');
            XLSX.writeFile(wb, `backup_biblioteca_${fecha}.xlsx`);
            
        } catch (error) {
            console.error('Error al generar backup:', error);
            alert('Error al generar la copia de seguridad: ' + error.message);
        } finally {
            if (loadingMsg) loadingMsg.remove();
        }
    }
    
    function cargarSheetJS() {
        return new Promise((resolve, reject) => {
            const script = document.createElement('script');
            script.src = 'https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js';
            script.onload = resolve;
            script.onerror = reject;
            document.head.appendChild(script);
        });
    }
    
    // ==================== RESTAURAR BACKUP ====================
    async function restaurarBackup() {
        // Crear input de archivo oculto
        const input = document.createElement('input');
        input.type = 'file';
        input.accept = '.xlsx, .xls, .csv, .json';
        input.onchange = async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            
            if (!confirm('⚠️ ADVERTENCIA: Restaurar un backup SOBRESCRIBIRÁ los datos actuales.\n\n¿Estás seguro de que quieres continuar?')) return;
            
            const loadingMsg = document.createElement('div');
            loadingMsg.innerHTML = '<div style="position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); background:white; padding:20px; border-radius:12px; z-index:10000;">🔄 Restaurando datos...<br>Por favor, espera.</div>';
            document.body.appendChild(loadingMsg);
            
            try {
                if (typeof XLSX === 'undefined') await cargarSheetJS();
                
                const data = await file.arrayBuffer();
                const workbook = XLSX.read(data);
                
                // Procesar cada hoja
                const sheets = {
                    Alumnos: workbook.Sheets['Alumnos'],
                    Libros: workbook.Sheets['Libros'],
                    Préstamos: workbook.Sheets['Préstamos'],
                    Socios: workbook.Sheets['Socios'],
                    Historial_Alumnos: workbook.Sheets['Historial_Alumnos']
                };
                
                // Verificar que al menos hay una hoja válida
                if (!sheets.Alumnos && !sheets.Libros) {
                    alert('El archivo no contiene datos válidos para restaurar');
                    loadingMsg.remove();
                    return;
                }
                
                // Restaurar Alumnos
                if (sheets.Alumnos) {
                    const alumnos = XLSX.utils.sheet_to_json(sheets.Alumnos);
                    if (alumnos.length > 0) {
                        await supabase.from('alumnos').delete().neq('id', 0);
                        for (const alumno of alumnos) {
                            await supabase.from('alumnos').insert(alumno);
                        }
                        console.log(`✅ Restaurados ${alumnos.length} alumnos`);
                    }
                }
                
                // Restaurar Libros
                if (sheets.Libros) {
                    const libros = XLSX.utils.sheet_to_json(sheets.Libros);
                    if (libros.length > 0) {
                        await supabase.from('libros').delete().neq('codigo_barras', '');
                        for (const libro of libros) {
                            await supabase.from('libros').insert(libro);
                        }
                        console.log(`✅ Restaurados ${libros.length} libros`);
                    }
                }
                
                // Restaurar Préstamos
                if (sheets.Préstamos) {
                    const prestamos = XLSX.utils.sheet_to_json(sheets.Préstamos);
                    if (prestamos.length > 0) {
                        await supabase.from('prestamos').delete().neq('id', 0);
                        for (const prestamo of prestamos) {
                            await supabase.from('prestamos').insert({
                                id: prestamo.id,
                                libro_codigo: prestamo.libro_codigo,
                                alumno_id: prestamo.alumno_id,
                                fecha_prestamo: prestamo.fecha_prestamo,
                                fecha_devolucion: prestamo.fecha_devolucion,
                                entregado: prestamo.entregado,
                                ano_academico_id: prestamo.ano_academico_id,
                                notas: prestamo.notas
                            });
                        }
                        console.log(`✅ Restaurados ${prestamos.length} préstamos`);
                    }
                }
                
                // Restaurar Socios
                if (sheets.Socios) {
                    const socios = XLSX.utils.sheet_to_json(sheets.Socios);
                    if (socios.length > 0) {
                        await supabase.from('socios').delete().neq('id', 0);
                        for (const socio of socios) {
                            await supabase.from('socios').insert({
                                id: socio.id,
                                n_socio: socio.n_socio,
                                alumno_id: socio.alumno_id,
                                ano_academico_id: socio.ano_academico_id,
                                fecha_pago: socio.fecha_pago,
                                pagado: socio.pagado,
                                activo: socio.activo
                            });
                        }
                        console.log(`✅ Restaurados ${socios.length} socios`);
                    }
                }
                
                // Restaurar Historial Alumnos
                if (sheets.Historial_Alumnos) {
                    const historiales = XLSX.utils.sheet_to_json(sheets.Historial_Alumnos);
                    if (historiales.length > 0) {
                        await supabase.from('historial_alumnos').delete().neq('id', 0);
                        for (const h of historiales) {
                            await supabase.from('historial_alumnos').insert({
                                id: h.id,
                                alumno_id: h.alumno_id,
                                ano_academico_id: h.ano_academico_id,
                                curso: h.curso,
                                grupo: h.grupo,
                                telefono: h.telefono,
                                bilingue: h.bilingue,
                                beca: h.beca,
                                socio_ampa: h.socio_ampa,
                                diversificacion: h.diversificacion,
                                donante: h.donante,
                                observaciones: h.observaciones,
                                lote_entregado: h.lote_entregado,
                                fecha_entrega: h.fecha_entrega,
                                activo: h.activo
                            });
                        }
                        console.log(`✅ Restaurados ${historiales.length} registros de historial`);
                    }
                }
                
                alert('✅ Restauración completada. Recarga la página para ver los cambios.');
                location.reload();
                
            } catch (error) {
                console.error('Error al restaurar:', error);
                alert('Error al restaurar el backup: ' + error.message);
            } finally {
                if (loadingMsg) loadingMsg.remove();
            }
        };
        input.click();
    }
